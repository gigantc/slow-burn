<VirtualHost *:80>
    ServerName slowburn.gigantc.com

    # Photo uploads are capped at 15 MB by the app; allow a little headroom for the multipart envelope.
    LimitRequestBody 16777216

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3100/
    ProxyPassReverse / http://127.0.0.1:3100/

    ErrorLog ${APACHE_LOG_DIR}/slowburn-error.log
    CustomLog ${APACHE_LOG_DIR}/slowburn-access.log combined
</VirtualHost>
